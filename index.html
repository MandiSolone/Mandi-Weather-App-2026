<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandi's Weather App 2026</title>
    <Link rel="stylesheet" href="style.css"></Link>
</head>
<body>
    <h1>Mandi's Weather App 2026</h1>

    <div class ="input-group">
        <input type="text" id="cityInput" list="searchedList" placeholder="Enter A City Name">
        <datalist id="searchedList"></datalist>
        <button id="searchBtn">Search</button>
    </div>
    
    <div class ="results">
        <div class="card">       
            <div id="weatherResult"></div>
            <div id="errorMessage"></div>
        </div>
    </div>
    
        <button id="toggleTemp">°C / °F</button>

    <script src="app.js"></script>
</body>
</html>
